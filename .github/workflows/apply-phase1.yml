name: Apply FraudShield Phase 1

on:
  push:
    branches:
      - phase-1-fraudshield-hardening
    paths:
      - .github/workflows/apply-phase1.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-fraudshield-hardening
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify patch
        run: git apply --check fraudshield-phase-1.patch

      - name: Apply corrections
        run: git apply fraudshield-phase-1.patch

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check Python compilation
        run: python -m compileall -q app.py scoring.py transactions.py paypal_sandbox.py paypal_simulator.py

      - name: Commit and push verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .devcontainer/devcontainer.json .gitignore .streamlit/config.toml README.md app.py paypal_sandbox.py scoring.py tests/test_app_flows.py tests/test_phase1.py transactions.py
          git commit -m "Apply verified FraudShield Phase 1 fixes"
          git push origin HEAD:phase-1-fraudshield-hardening
