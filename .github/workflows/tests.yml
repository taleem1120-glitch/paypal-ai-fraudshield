name: FraudShield Tests

on:
  push:
    branches:
      - main
      - phase-1-fraudshield-hardening
      - competition-2026
      - phase-2-competition
  pull_request:
    branches:
      - main
      - competition-2026

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check Python compilation
        run: python -m compileall -q app.py scoring.py transactions.py paypal_sandbox.py paypal_simulator.py investigations.py investigation_ui.py benchmarking.py audit.py competition_benchmark.py

      - name: Run reproducible synthetic benchmark
        run: python benchmarking.py --size 1000 --seed 2026 > benchmark.json

      - name: Measure synthetic evaluation repeatability and timing
        run: python competition_benchmark.py > competition-benchmark.json

      - name: Upload synthetic benchmark
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark-python-${{ matrix.python }}
          path: |
            benchmark.json
            competition-benchmark.json
