name: FraudShield Phase 1 Tests

on:
  push:
    branches:
      - main
      - phase-1-fraudshield-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check Python compilation
        run: python -m compileall -q app.py scoring.py transactions.py paypal_sandbox.py paypal_simulator.py
